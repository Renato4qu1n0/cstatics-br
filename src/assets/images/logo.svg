<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" fill="none" role="img" aria-labelledby="logoTitle logoDesc">
  <title id="logoTitle">CSTatics Brasil</title>
  <desc id="logoDesc">Placa tática chanfrada com retícula de mira.</desc>

  <!-- placa HUD: chanfro superior-direito e inferior-esquerdo (mesma linguagem dos painéis do site) -->
  <path d="M5 5 H44 L59 20 V59 H20 L5 44 Z"
        fill="#0F1319" stroke="#FFB020" stroke-width="2.6" stroke-linejoin="miter" />

  <!-- anel da retícula -->
  <circle cx="32" cy="32" r="12.5" stroke="#FFB020" stroke-width="2.4" />

  <!-- marcas de mira cruzando o anel -->
  <g stroke="#FFB020" stroke-width="2.4" stroke-linecap="square">
    <path d="M32 13.5 V22" />
    <path d="M32 42 V50.5" />
    <path d="M13.5 32 H22" />
    <path d="M42 32 H50.5" />
  </g>

  <!-- ponto central -->
  <circle cx="32" cy="32" r="2.8" fill="#FFB020" />
</svg>
